<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

  <style>
    :root {
      --bg: #0f1a40;
      --bg-card: #162050;
      --surface: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.08);
      --text: #ffffff;
      --text-dim: rgba(255,255,255,.55);
      --primary: #4d8dff;
      --accent: #7c5cfc;
      --grad: linear-gradient(135deg, #4d8dff, #7c5cfc);
      --grad-warm: linear-gradient(135deg, #f97316, #ec4899);
      --radius: 20px;
      --radius-sm: 14px;
      --sans: "Inter", "Cairo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow */
    body::before {
      content: "";
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(77,141,255,.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(124,92,252,.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow:
        0 4px 24px rgba(0,0,0,.4),
        0 0 0 1px rgba(255,255,255,.04) inset;
    }

    /* Header */
    .card-head {
      position: relative;
      padding: 36px 28px 28px;
      text-align: center;
      background:
        radial-gradient(ellipse at 30% 0%, rgba(77,141,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 0%, rgba(124,92,252,.12) 0%, transparent 60%);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      margin-bottom: 16px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }

    .role {
      font-size: .88rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .role-ar {
      font-family: "Cairo", sans-serif;
      font-size: .82rem;
      font-weight: 600;
      color: rgba(255,255,255,.35);
    }

    /* Status */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      font-weight: 600;
      color: #34d399;
      background: rgba(52,211,153,.1);
      border: 1px solid rgba(52,211,153,.2);
      padding: 4px 12px;
      border-radius: 999px;
      margin-top: 12px;
    }
    .status .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,.5); }
      70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 0 28px;
    }

    /* Links */
    .links {
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      font-size: .92rem;
      font-weight: 600;
      transition: background .2s, border-color .2s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .link-btn:hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.15);
    }
    .link-btn:active {
      transform: scale(.98);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .link-icon svg { width: 20px; height: 20px; }

    .link-icon.wa { background: rgba(37,211,102,.15); color: #25d366; }
    .link-icon.phone { background: rgba(77,141,255,.15); color: #4d8dff; }
    .link-icon.email { background: rgba(249,115,22,.15); color: #f97316; }
    .link-icon.web { background: rgba(124,92,252,.15); color: #7c5cfc; }
    .link-icon.cv { background: rgba(236,72,153,.15); color: #ec4899; }

    .link-text { flex: 1; min-width: 0; }
    .link-label { display: block; font-size: .72rem; font-weight: 500; color: var(--text-dim); margin-bottom: 1px; }
    .link-value { display: block; font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .link-arrow {
      width: 18px; height: 18px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* Social row */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 20px 24px;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--text-dim);
      text-decoration: none;
      transition: background .2s, color .2s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .social-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .social-btn:active { transform: scale(.92); }
    .social-btn svg { width: 22px; height: 22px; }

    /* Footer */
    .card-footer {
      text-align: center;
      padding: 16px 20px 20px;
      font-size: .7rem;
      color: var(--text-dim);
    }

    /* vCard download */
    .vcard-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 20px;
      background: var(--grad);
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .vcard-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(77,141,255,.35); }
    .vcard-btn:active { transform: scale(.97); }
    .vcard-btn svg { width: 16px; height: 16px; }

    /* Print */
    @media print {
      body { background: #fff; padding: 0; }
      body::before, body::after { display: none; }
      .card { box-shadow: none; border: 1px solid #ddd; max-width: 100%; }
      .link-btn { border-color: #eee; }
    }
  </style>
</head>
