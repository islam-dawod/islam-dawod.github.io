<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السيرة الذاتية | إسلام داود — مصمم ومطور مواقع وتطبيقات</title>
  <meta name="description" content="السيرة الذاتية لإسلام داود: مصمم ومطور مواقع وتطبيقات متخصص في تطوير المواقع والمتاجر الإلكترونية والتسويق الرقمي." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://islam-dawod.github.io/cv.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1" />
  <link rel="shortcut icon" href="favicon.ico?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #0f1a40;
      --muted: #5a6a88;
      --primary: #0066cc;
      --primary-2: #7a3fd1;
      --grad: linear-gradient(135deg, #0066cc, #7a3fd1);
      --border: #dde7f5;
      --bg-alt: #f7faff;
      --sans: "Poppins", "Cairo", "Tajawal", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef2f9;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* Toolbar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: inherit;
      font-weight: 700;
      font-size: .98rem;
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 11px 26px;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, background .2s, color .2s;
    }
    .tb-btn svg { width: 19px; height: 19px; }
    .tb-primary {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 12px 26px -8px rgba(0, 102, 204, .6);
    }
    .tb-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px -10px rgba(122, 63, 209, .6);
    }
    .tb-ghost {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }
    .tb-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* PDF Container */
    .pdf-wrap {
      max-width: 900px;
      margin: 24px auto;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 60px -25px rgba(15, 26, 64, .35);
    }
    .pdf-frame {
      width: 100%;
      height: calc(100vh - 120px);
      min-height: 600px;
      border: none;
      display: block;
    }

    /* Fallback for browsers that block PDF embedding */
    .pdf-fallback {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .pdf-fallback h2 {
      font-size: 1.3rem;
      color: var(--text);
      margin: 0 0 12px;
    }
    .pdf-fallback p {
      color: var(--muted);
      margin: 0 0 24px;
    }

    @media (max-width: 640px) {
      .toolbar { gap: 8px; padding: 10px 12px; }
      .tb-btn { padding: 9px 18px; font-size: .9rem; }
      .pdf-wrap { margin: 0; border-radius: 0; }
      .pdf-frame { height: calc(100vh - 100px); min-height: 500px; }
    }

    @media print {
      .toolbar { display: none; }
      .pdf-wrap { margin: 0; box-shadow: none; border-radius: 0; }
      .pdf-frame { height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <a class="tb-btn tb-primary" href="Islam_faysal_CV.pdf" download="Islam_Faysal_CV.pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      تحميل PDF
    </a>
    <a class="tb-btn tb-ghost" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      العودة للموقع
    </a>
  </div>

  <div class="pdf-wrap">
    <object class="pdf-frame" data="Islam_faysal_CV.pdf" type="application/pdf">
      <div class="pdf-fallback" style="display:block">
        <h2>السيرة الذاتية</h2>
        <p>لا يمكن عرض الملف مباشرة. يمكنك تحميله من الزر أعلاه.</p>
        <a class="tb-btn tb-primary" href="Islam_faysal_CV.pdf" download="Islam_Faysal_CV.pdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          تحميل السيرة الذاتية
        </a>
      </div>
    </object>
  </div>

</body>
</html>
